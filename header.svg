<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="300" fill="#0d1117" />

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="50" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="1050" cy="250" r="180" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="150" r="140" fill="#10b981" opacity="0.10" filter="url(#glow)" />

  <!-- Outer Card Frame -->
  <rect x="20" y="20" width="1160" height="260" rx="16" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Top Accent Color Bar -->
  <path d="M 20 36 Q 20 20 36 20 L 1164 20 Q 1180 20 1180 36 L 1180 24 L 20 24 Z" fill="url(#accentGrad)" />

  <!-- Content Group -->
  <g transform="translate(60, 65)">
    <!-- Status / Role Badge -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="14" r="4.5" fill="#10b981" />
    <text x="28" y="18" fill="#7ee787" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">
      OPEN FOR SOFTWARE OPPORTUNITIES
    </text>

    <!-- Main Name -->
    <text x="0" y="78" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Aulia Radix Putra Winarko
    </text>

    <!-- Subtitle / Identity -->
    <text x="0" y="112" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="500">
      Software Engineer &amp; Informatics Student at <tspan fill="#58a6ff" font-weight="600">Telkom University Purwokerto</tspan>
    </text>

    <!-- Tech Pillars Badges -->
    <g transform="translate(0, 140)">
      <!-- Badge 1: Full-Stack Web -->
      <rect x="0" y="0" width="165" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="82" y="19" fill="#58a6ff" font-family="DejaVu Sans Mono, monospace" font-size="11.5" font-weight="600" text-anchor="middle">
        Next.js &amp; Laravel
      </text>

      <!-- Badge 2: Mobile -->
      <rect x="175" y="0" width="155" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="252" y="19" fill="#38bdf8" font-family="DejaVu Sans Mono, monospace" font-size="11.5" font-weight="600" text-anchor="middle">
        Flutter &amp; Mobile
      </text>

      <!-- Badge 3: Database & Cloud -->
      <rect x="340" y="0" width="170" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="425" y="19" fill="#7ee787" font-family="DejaVu Sans Mono, monospace" font-size="11.5" font-weight="600" text-anchor="middle">
        MySQL &amp; Supabase
      </text>

      <!-- Badge 4: Applied AI -->
      <rect x="520" y="0" width="180" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="610" y="19" fill="#f59e0b" font-family="DejaVu Sans Mono, monospace" font-size="11.5" font-weight="600" text-anchor="middle">
        Python · YOLO · Vision
      </text>
    </g>
  </g>

  <!-- Right Decorative Terminal Box -->
  <g transform="translate(860, 60)">
    <rect width="280" height="175" rx="12" fill="#090d16" stroke="#30363d" stroke-width="1" />
    <!-- Terminal header -->
    <rect width="280" height="30" rx="12" fill="#161b22" />
    <rect y="18" width="280" height="12" fill="#161b22" />
    <circle cx="16" cy="15" r="4" fill="#ff5f56" />
    <circle cx="28" cy="15" r="4" fill="#ffbd2e" />
    <circle cx="40" cy="15" r="4" fill="#27c93f" />
    <text x="150" y="19" fill="#8b949e" font-family="DejaVu Sans Mono, monospace" font-size="10.5" text-anchor="middle">radix@workspace</text>
    <line x1="0" y1="30" x2="280" y2="30" stroke="#30363d" stroke-width="1" />

    <!-- Terminal code snippet -->
    <text x="16" y="55" fill="#8b949e" font-family="DejaVu Sans Mono, monospace" font-size="11">$ <tspan fill="#7ee787">curl</tspan> radix.bio</text>
    <text x="16" y="76" fill="#79c0ff" font-family="DejaVu Sans Mono, monospace" font-size="10.5">name: <tspan fill="#f0f6fc">"Aulia Radix"</tspan></text>
    <text x="16" y="95" fill="#79c0ff" font-family="DejaVu Sans Mono, monospace" font-size="10.5">status: <tspan fill="#7ee787">"Semester 7 IF"</tspan></text>
    <text x="16" y="114" fill="#79c0ff" font-family="DejaVu Sans Mono, monospace" font-size="10.5">intern: <tspan fill="#d2a8ff">["BTN", "Diskominfo"]</tspan></text>
    <text x="16" y="133" fill="#79c0ff" font-family="DejaVu Sans Mono, monospace" font-size="10.5">web: <tspan fill="#58a6ff">auliaradix.github.io</tspan></text>
    <text x="16" y="154" fill="#3fb950" font-family="DejaVu Sans Mono, monospace" font-size="10.5">● Ready to deploy</text>
  </g>
</svg>